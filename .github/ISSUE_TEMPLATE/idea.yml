# 원본(source): https://github.com/Feynman520/iris-community — 여기서 고치지 말고 원본을 고칩니다.
name: 의견·제안 (Idea)
description: 이런 기능이 있으면 좋겠다, 이 부분이 불편하다 (Feature idea or feedback)
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        한국어·영어 모두 좋습니다.
        여기에 남긴 의견과 아이디어는 관리자가 자유롭게 제품에 반영할 수 있으며, 보상이나 이름 표시의 의무는 없습니다. (Ideas posted here may be used freely by the Maintainer, without any obligation of compensation or credit.)
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 필요한가요 (Situation)
      description: 무엇을 하려다 불편했는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 어떻게 되면 좋을까요 (Idea)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 어디에 해당할 것 같나요 (Where it fits)
      description: 몰라도 됩니다.
      options:
        - 모르겠음 (Not sure)
        - 본체 — 모든 사용자에게 필요 (Core)
        - 모듈 — 필요한 사람만 꽂아 씀 (Module)
        - MCP·스킬 — 에이전트가 부르는 능력 (MCP / skill)
